import groovy.json.JsonOutput

plugins {
    id 'base'
}

group = 'com.tuftuvisuals'
version = '1.0.0'

def generatedResources = layout.buildDirectory.dir('generated/tuftuResources')

tasks.register('generateModResources') {
    outputs.dir(generatedResources)

    doLast {
        File root = generatedResources.get().asFile

        delete(root)
        root.mkdirs()

        def metadata = [
            schemaVersion: 1,
            id: 'tuftu_visuals',
            version: project.version.toString(),
            name: 'Tuftu Visuals',
            description: 'PvP visuals for Fabric',
            environment: 'client',
            depends: [
                fabricloader: '>=0.18.0',
                minecraft: '1.21.11'
            ]
        ]

        new File(root, 'fabric.mod.json').setText(
            JsonOutput.prettyPrint(JsonOutput.toJson(metadata)),
            'UTF-8'
        )

        File models = new File(root, 'assets/minecraft/models/item')
        models.mkdirs()

        def swords = [
            'wooden_sword',
            'stone_sword',
            'iron_sword',
            'golden_sword',
            'diamond_sword',
            'netherite_sword'
        ]

        swords.each { sword ->
            def model = [
                parent: 'minecraft:item/handheld',
                textures: [
                    layer0: "minecraft:item/${sword}".toString()
                ],
                display: [
                    firstperson_righthand: [
                        rotation: [0, -90, 25],
                        translation: [1.13, 3.2, 1.13],
                        scale: [0.52, 0.52, 0.52]
                    ],
                    firstperson_lefthand: [
                        rotation: [0, 90, -25],
                        translation: [1.13, 3.2, 1.13],
                        scale: [0.52, 0.52, 0.52]
                    ],
                    thirdperson_righthand: [
                        rotation: [0, -90, 55],
                        translation: [0, 4, 0.5],
                        scale: [0.6, 0.6, 0.6]
                    ],
                    thirdperson_lefthand: [
                        rotation: [0, 90, -55],
                        translation: [0, 4, 0.5],
                        scale: [0.6, 0.6, 0.6]
                    ]
                ]
            ]

            new File(models, "${sword}.json").setText(
                JsonOutput.prettyPrint(JsonOutput.toJson(model)),
                'UTF-8'
            )
        }
    }
}

tasks.register('jar', Jar) {
    dependsOn tasks.named('generateModResources')
    archiveBaseName = 'TuftuVisuals'
    from(generatedResources)
}

tasks.named('assemble') {
    dependsOn tasks.named('jar')
}
